<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Page not found | Retirement Investing Dashboard</title>
    <!-- This page is a Vite HTML entry (rather than a file copied straight out of public/) so
         that %BASE_URL% gets substituted at build time. Netlify serves the site from "/", but
         a GitHub Pages project site serves it from "/<repo>/", and a hardcoded "/" would send
         visitors to the wrong origin root there. -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e5e9f0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#2e3440" />
    <style>
      :root {
        color-scheme: light;
        --surface: #e5e9f0;
        --card: #eceff4;
        --text: #2e3440;
        --muted: #566074;
        --border: rgba(46, 52, 64, 0.12);
        --accent: #4c566a;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --surface: #2e3440;
          --card: #3b4252;
          --text: #eceff4;
          --muted: #a7b1c2;
          --border: rgba(216, 222, 233, 0.1);
          --accent: #a3be8c;
        }
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--surface);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      main {
        max-width: 28rem;
        padding: 32px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--card);
        text-align: center;
      }

      p.code {
        margin: 0;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
      }

      h1 {
        margin: 12px 0 0;
        font-size: 22px;
      }

      p.body {
        margin: 12px 0 24px;
        font-size: 14px;
        line-height: 1.6;
        color: var(--muted);
      }

      a {
        display: inline-block;
        padding: 10px 18px;
        border-radius: 8px;
        background: var(--text);
        color: var(--surface);
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">Error 404</p>
      <h1>This page does not exist</h1>
      <p class="body">
        The dashboard lives on a single page, so there is not much else to find here. The link you
        followed may be out of date.
      </p>
      <a href="%BASE_URL%">Back to the dashboard</a>
    </main>
  </body>
</html>
