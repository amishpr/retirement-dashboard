    <!-- Structured data. Everything here is also stated on the page itself, which is what Google
         asks for — the markup describes the tool, it doesn't claim anything extra. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Retirement Investing Dashboard",
        "url": "https://amishpr-retirement-dashboard.netlify.app/",
        "description": "An interactive dashboard for projecting how ETF and stock investments could grow toward retirement, with charts for growth, retirement income, risk, holdings, and sector exposure.",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "inLanguage": "en",
        "isAccessibleForFree": true,
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "author": {
          "@type": "Person",
          "name": "Amish Prajapati",
          "url": "https://github.com/amishpr"
        },
        "featureList": [
          "Compound growth projections with weekly, biweekly, monthly, or yearly contributions",
          "Ten preset ETFs plus any custom ticker",
          "Blend multiple funds into one portfolio with adjustable weights",
          "Goal mode that solves for the contribution needed to reach a target income",
          "Risk and volatility comparison across funds",
          "Holdings, sector, and geography breakdowns",
          "CSV and Excel export, plus a printable PDF report"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>Retirement Investing Dashboard</h1>
      <p>
        An interactive dashboard for projecting how ETF and stock investments could grow toward
        retirement. Pick a preset fund, type in any ticker, or blend several funds into a portfolio,
        then set your age, current savings, and contribution schedule to project your balance
        forward. Charts cover growth over time, optimistic and conservative scenarios, estimated
        retirement income, risk and volatility, top holdings, sector weightings, and domestic versus
        international exposure. A goal mode works backward from the retirement income you want and
        solves for the contribution needed to get there.
      </p>
      <p>
        This dashboard needs JavaScript to run its projections. Please enable JavaScript and reload
        the page.
      </p>
      <p>
        Made by <a href="https://github.com/amishpr">Amish Prajapati</a>. The source is on
        <a href="https://github.com/amishpr/retirement-dashboard">GitHub</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
